<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Offline — STRIDE+</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    background: #0a0a0c;
    color: #f4f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
  }
  .card { max-width: 340px; background: #1c1c22; border-radius: 26px; padding: 32px 24px; }
  .mark { width: 72px; height: 72px; border-radius: 20px; background: #0a0a0c; display: inline-flex; align-items: center; justify-content: center; }
  h1 { margin: 20px 0 8px; font-size: 22px; font-style: italic; }
  h1 span { color: #ffd23f; }
  p { margin: 0 0 24px; color: #a3a3ae; font-size: 14px; line-height: 1.6; }
  button {
    min-height: 48px; width: 100%; border: 0; border-radius: 14px;
    background: #ff4f9a; color: #0a0a0c; font: inherit; font-weight: 600; font-size: 15px;
  }
</style>
</head>
<body>
  <main class="card">
    <!-- Inline so it shows with no connection (the service worker only serves this page). -->
    <span class="mark" aria-hidden="true">
      <svg width="46" height="46" viewBox="0 0 32 32">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff4f9a"/></linearGradient></defs>
        <path d="M27.5 3.5 L12 5 L6.2 17.2 L16.4 16.2 L12.6 24.4 L4.5 28.5 L19.8 27 L26 12.4 L15.6 13.4 L17.6 8.6 Z" fill="url(#g)"/>
      </svg>
    </span>
    <h1>STRIDE<span>+</span> sedang offline</h1>
    <p>Tidak ada koneksi internet. Data latihanmu diambil dari server, jadi sambungkan lagi lalu coba muat ulang.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
